apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campuscare
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: campuscare-helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: campuscare-helpdesk
    spec:
      containers:
        - name: frontend
          image: campuscare/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
