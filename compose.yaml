name: campuscare-helpdesk
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: campuscare_helpdesk
    ports: ["${MYSQL_PORT:-3307}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [campuscare-network]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      CAMPUSCARE_DB_URL: jdbc:mysql://mysql:3306/campuscare_helpdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CAMPUSCARE_DB_USERNAME: root
      CAMPUSCARE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      CAMPUSCARE_DDL_AUTO: ${CAMPUSCARE_DDL_AUTO:-validate}
      CAMPUSCARE_JWT_SECRET: ${CAMPUSCARE_JWT_SECRET:?Set CAMPUSCARE_JWT_SECRET in .env}
      CAMPUSCARE_JWT_EXPIRATION_SECONDS: ${CAMPUSCARE_JWT_EXPIRATION_SECONDS:-3600}
      CAMPUSCARE_ADMIN_NAME: ${CAMPUSCARE_ADMIN_NAME:-CampusCare Admin}
      CAMPUSCARE_ADMIN_EMAIL: ${CAMPUSCARE_ADMIN_EMAIL:-}
      CAMPUSCARE_ADMIN_PASSWORD: ${CAMPUSCARE_ADMIN_PASSWORD:-}
    ports: ["${BACKEND_PORT:-8080}:8080"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [campuscare-network]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: "http://localhost:${BACKEND_PORT:-8080}" }
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [campuscare-network]
volumes:
  mysql-data: { name: campuscare-mysql-data }
networks:
  campuscare-network: { name: campuscare-network, driver: bridge }
