spring:
  application:
    name: campuscare-helpdesk-api
  datasource:
    url: ${CAMPUSCARE_DB_URL:jdbc:mysql://localhost:3306/campuscare_helpdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CAMPUSCARE_DB_USERNAME:root}
    password: ${CAMPUSCARE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${CAMPUSCARE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

campuscare:
  jwt:
    secret: ${CAMPUSCARE_JWT_SECRET}
    expiration-seconds: ${CAMPUSCARE_JWT_EXPIRATION_SECONDS:3600}
  admin:
    name: ${CAMPUSCARE_ADMIN_NAME:CampusCare Admin}
    email: ${CAMPUSCARE_ADMIN_EMAIL:}
    password: ${CAMPUSCARE_ADMIN_PASSWORD:}
